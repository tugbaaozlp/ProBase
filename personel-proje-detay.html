<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proje Detayı - ProBASE</title>
  <link rel="stylesheet" href="personel.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --p-primary: #3b82f6;
      --p-bg: #f8fafc;
      --p-sidebar: #0f172a;
      --font-main: 'Outfit', sans-serif;
    }
    
    * { box-sizing: border-box; font-family: var(--font-main); }
    body { background: var(--p-bg); margin: 0; height: 100vh; overflow: hidden; }

    .layout { display: flex; height: 100vh; width: 100vw; }
    
    /* LEFT SIDEBAR */
    .sidebar { width: 260px; background: var(--p-sidebar); color: white; display: flex; flex-direction: column; padding: 30px 20px; transition: 0.3s; }
    .sidebar-logo { display: flex; align-items: center; gap: 15px; margin-bottom: 40px; }
    .sidebar-logo svg { width: 35px; height: 35px; }
    .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .nav-btn { background: transparent; color: #94a3b8; border: none; padding: 12px 15px; border-radius: 12px; text-align: left; cursor: pointer; font-weight: 500; transition: 0.3s; }
    .nav-btn.active { background: #1e293b; color: white; }
    .nav-btn:hover { background: #1e293b; color: white; }

    /* TOP BAR */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f8fafc; }
    .top-bar { 
      height: 70px; 
      background: white; 
      border-bottom: 1px solid #e2e8f0; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 30px;
      z-index: 20;
    }
    .top-user { display: flex; align-items: center; gap: 12px; }
    .top-user img { width: 40px; height: 40px; border-radius: 12px; border: 2px solid #f1f5f9; }
    .top-user-text h4 { margin: 0; font-size: 14px; font-weight: 700; color: #1e293b; }
    .top-user-text span { font-size: 11px; color: #64748b; }

    /* CONTENT AREA */
    .content-area { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; }
    
    .detail-header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 5px; }
    .btn-back { background: #eff6ff; color: var(--p-primary); border: none; padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn-back:hover { background: #dbeafe; }

    .stats-card { background: white; border-radius: 24px; padding: 30px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
    .stat-item { padding: 20px; background: #f8fafc; border-radius: 20px; border: 1px solid #f1f5f9; text-align: center; }
    .stat-label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 18px; font-weight: 800; color: #0f172a; margin-top: 5px; }

    .task-section { margin-top: 10px; }
    .task-item { 
      display: flex; 
      align-items: center; 
      gap: 15px; 
      padding: 18px; 
      background: white; 
      border-radius: 18px; 
      border: 1px solid #f1f5f9; 
      margin-bottom: 12px;
      transition: 0.2s;
    }
    .task-item:hover { border-color: var(--p-primary); transform: translateX(5px); }
    .task-check { width: 20px; height: 20px; accent-color: var(--p-primary); cursor: pointer; }
    .task-body { flex: 1; }
    .task-name { font-weight: 700; font-size: 14px; color: #1e293b; }
    .task-meta { font-size: 11px; color: #64748b; margin-top: 2px; }
    .task-badge { padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; }

    /* RIGHT CHAT SIDEBAR */
    .chat-sidebar { width: 380px; background: white; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; transition: 0.3s; }
    .chat-header { padding: 20px 25px; border-bottom: 1px solid #e2e8f0; font-size: 16px; font-weight: 800; color: #0f172a; }
    .chat-tabs-container { padding: 15px; background: #fafafa; border-bottom: 1px solid #f1f5f9; overflow-x: auto; scrollbar-width: none; }
    .chat-tabs { display: flex; gap: 15px; }
    .chat-tab { flex-shrink: 0; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .tab-img { width: 48px; height: 48px; border-radius: 15px; border: 2px solid transparent; transition: 0.2s; position: relative; overflow: hidden; background: #f1f5f9; }
    .chat-tab.active .tab-img { border-color: var(--p-primary); transform: scale(1.1); }
    .tab-label { font-size: 10px; font-weight: 700; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fbfcfe; }
    .chat-input-area { padding: 20px; background: white; border-top: 1px solid #f1f5f9; }
    .chat-input-box { display: flex; background: #f1f5f9; border-radius: 15px; padding: 10px 15px; align-items: center; gap: 10px; }
    .chat-input-box input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; }
    .chat-send-btn { background: var(--p-primary); color: white; border: none; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* RESPONSIVE */
    @media (max-width: 1200px) {
      .chat-sidebar { width: 320px; }
      .sidebar { width: 80px; padding: 20px 10px; }
      .sidebar-logo h2, .sidebar-nav .nav-btn { display: none; }
      .sidebar-logo { justify-content: center; }
    }
    @media (max-width: 768px) {
        .chat-sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg viewBox="0 0 120 120"><defs><linearGradient id="g5"><stop offset="0%" stopColor="#60a5fa"/><stop offset="100%" stopColor="#3b82f6"/></linearGradient></defs><rect x="14" y="14" width="92" height="92" rx="24" fill="none"/><path d="M36 32 H62 C70 32 76 38 76 46 V74 C76 82 70 88 62 88 H36" stroke="url(#g5)" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M42 48 H60 C65 48 70 52 70 58 V58 C70 64 65 68 60 68 H42" stroke="url(#g5)" stroke-width="12" stroke-linecap="round" fill="none"/></svg>
        <h2 style="margin:0; font-size:22px; font-weight:900;">ProBASE</h2>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn" onclick="location.href='personel.html'">Görevlerim</button>
        <button class="nav-btn active" onclick="location.href='personel-projeler.html'">Projelerim</button>
      </nav>
      <button class="nav-btn" style="color:#ef4444; margin-top:auto;" onclick="cikisYap()">Çıkış Yap</button>
    </aside>

    <div class="main-wrapper">
      <header class="top-bar">
        <div class="top-user">
          <img id="userAvatar" src="">
          <div class="top-user-text">
            <h4 id="userNameDisplay">...</h4>
            <span>Proje Detayı ve Durum Takibi</span>
          </div>
        </div>
        <button class="btn-back" onclick="location.href='personel-projeler.html'">← Projelere Dön</button>
      </header>

      <main class="content-area">
        <div class="detail-header-row">
            <div>
                <h1 id="pTitle" style="margin:0; font-size:30px; font-weight:900; color:#0f172a;">Yükleniyor...</h1>
                <p id="pSub" style="color:#64748b; margin-top:2px;">Proje detayları ve teknik bilgiler.</p>
            </div>
            <div id="pBadge" style="background:#eff6ff; color:var(--p-primary); padding:8px 20px; border-radius:12px; font-weight:800; font-size:13px;">Planlama</div>
        </div>

        <div class="stats-card">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Müşteri</div>
                    <div class="stat-value" id="sClient">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Bütçe</div>
                    <div class="stat-value" id="sBudget">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">İlerleme</div>
                    <div class="stat-value" id="sProgress">0%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Teslim Tarihi</div>
                    <div class="stat-value" id="sDeadline">-</div>
                </div>
            </div>
        </div>

        <div class="task-section">
            <h3 style="font-weight:800; color:#1e293b; margin-bottom:20px;">Projeye Atanan Görevler</h3>
            <div id="taskList"></div>
        </div>
      </main>
    </div>

    <aside class="chat-sidebar">
      <div class="chat-header">Hızlı Sohbet 💬</div>
      <div class="chat-tabs-container"><div class="chat-tabs" id="chatTabs"><div class="chat-tab active" id="tab-group" onclick="selectActiveChat('group')"><div class="tab-img" style="background:#8b5cf6; display:flex; align-items:center; justify-content:center; color:white;">🤖</div><div class="tab-label">Asistan</div></div><div id="dynamicTabs" style="display:flex; gap:15px;"></div></div></div>
      <div class="chat-messages" id="chatMsgs"></div>
      <div class="chat-input-area"><div class="chat-input-box"><input type="text" id="chatInput" placeholder="Mesajınız..." onkeypress="if(event.key==='Enter')sendMsg()"><button class="chat-send-btn" onclick="sendMsg()">➤</button></div></div>
    </aside>
  </div>

  <script>
    let activeChatId = "group";

    document.addEventListener("DOMContentLoaded", () => {
      const me = localStorage.getItem("userName");
      if(!me) { location.href="giriş.html"; return; }
      document.getElementById("userNameDisplay").textContent = me;
      document.getElementById("userAvatar").src = `https://api.dicebear.com/7.x/adventurer/svg?seed=${me.replace(/\s+/g,"")}&backgroundColor=ffdfbf`;
      
      const p = JSON.parse(localStorage.getItem("aktifProje"));
      if(p) {
          document.getElementById("pTitle").textContent = p.ad;
          document.getElementById("sClient").textContent = p.musteri || "-";
          document.getElementById("sBudget").textContent = p.butce + " ₺";
          document.getElementById("sProgress").textContent = (p.ilerleme || 0) + "%";
          document.getElementById("sDeadline").textContent = p.bitis || "Belirtilmedi";
          document.getElementById("pBadge").textContent = p.durum || "AKTİF";
      }

      init();
      setInterval(sync, 3000);
    });

    async function init(){ await loadPersonnel(); loadTasks(); renderMsgs(true); }
    async function sync(){ renderMsgs(false); }

    async function loadTasks() {
        const r = await fetch('/api/tasks');
        const tasks = await r.json();
        const list = document.getElementById("taskList");
        list.innerHTML = tasks.length > 0 ? "" : "<p style='color:#64748b;'>Henüz görev atanmamış.</p>";
        tasks.forEach(t => {
            const div = document.createElement("div");
            div.className = "task-item";
            div.innerHTML = `
                <input type="checkbox" class="task-check" ${t.progress===100?'checked':''} onchange="updateTaskProgress(${t.id}, this.checked)">
                <div class="task-body">
                    <div class="task-name">${t.baslik}</div>
                    <div class="task-meta">Sorumlu: ${t.sorumlu_kisi} | Departman: ${t.departman || 'Genel'}</div>
                </div>
                <div class="task-badge" style="background:${t.progress===100?'#ecfdf5':'#fff7ed'}; color:${t.progress===100?'#10b981':'#f97316'};">%${t.progress}</div>
            `;
            list.appendChild(div);
        });
    }

    async function updateTaskProgress(id, checked) {
        await fetch(`/api/tasks/${id}`, { 
            method:'PUT', 
            headers:{'Content-Type':'application/json'}, 
            body: JSON.stringify({ progress: checked ? 100 : 0 }) 
        });
        loadTasks(); // Refresh list
    }

    async function loadPersonnel(){
        const r = await fetch('/api/personnel');
        const personnel = await r.json();
        const container = document.getElementById("dynamicTabs");
        container.innerHTML = "";
        const me = localStorage.getItem("userName");
        personnel.forEach(p => {
            if(p.kullaniciAdi === me) return;
            const div = document.createElement("div");
            div.className = `chat-tab ${activeChatId === p.kullaniciAdi ? 'active' : ''}`;
            div.onclick = () => { activeChatId = p.kullaniciAdi; selectActiveChat(p.kullaniciAdi); };
            div.innerHTML = `<div class="tab-img"><img src="https://api.dicebear.com/7.x/adventurer/svg?seed=${p.kullaniciAdi.replace(/\s+/g,"")}&backgroundColor=ffdfbf" style="width:100%"></div><div class="tab-label">${p.kullaniciAdi.split(' ')[0]}</div>`;
            container.appendChild(div);
        });
    }

    function selectActiveChat(id){ 
        activeChatId = id; 
        document.getElementById("tab-group").classList.toggle("active", id === 'group'); 
        loadPersonnel(); 
        renderMsgs(true); 
    }

    async function renderMsgs(force){
        const me = localStorage.getItem("userName");
        const r = await fetch(`/api/messages?receiver=${activeChatId === 'group' ? 'group' : encodeURIComponent(activeChatId)}&sender=${encodeURIComponent(me)}`);
        const msgs = await r.json();
        const body = document.getElementById("chatMsgs");
        body.innerHTML = msgs.map(m => {
            const self = m.sender === me;
            return `<div style="align-self:${self?'flex-end':'flex-start'}; max-width:85%;"><div style="font-size:10px; color:#94a3b8; text-align:${self?'right':'left'}">${m.sender} ${m.time}</div><div style="padding:12px; border-radius:15px; background:${self?'var(--p-primary)':'white'}; color:${self?'white':'#1e293b'}; border:${self?'none':'1px solid #f1f5f9'}; font-size:14px;">${m.text}</div></div>`;
        }).join('');
        if(force) body.scrollTop = body.scrollHeight;
    }

    async function sendMsg(){
        const i = document.getElementById("chatInput");
        const t = i.value.trim(); if(!t) return;
        const me = localStorage.getItem("userName");
        await fetch('/api/messages', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sender:me, receiver:activeChatId, text:t, time:new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) }) });
        i.value = ""; renderMsgs(true);
    }
    function cikisYap(){ localStorage.clear(); location.href="giriş.html"; }
  </script>
</body>
</html>
