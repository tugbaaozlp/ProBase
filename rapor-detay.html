<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proje Analiz Raporu - ProBASE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #0f172a;
            --bg: #e5e7eb;
            --card-radius: 24px;
        }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
        
        .report-container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 25px; }
        
        /* Mock Sidebar to match image */
        .mock-sidebar { background: #0f172a; border-radius: 24px; padding: 30px 20px; color: white; height: fit-content; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .logo svg { width: 35px; height: 35px; }
        .sidebar-btn { background: #3b82f6; color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-weight: 700; margin-bottom: 10px; cursor: pointer; text-align: left; }
        .sidebar-btn.secondary { background: #1e293b; color: #94a3b8; }

        .main-content { display: flex; flex-direction: column; gap: 25px; padding-bottom: 100px; }
        
        .report-header-card { background: white; padding: 25px 40px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; }
        .report-header-card h1 { margin: 0; font-size: 28px; font-weight: 800; text-transform: uppercase; color: #1e293b; }

        .top-row { display: grid; grid-template-columns: 1.5fr 1fr; gap: 25px; }
        .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }

        .card { background: white; border-radius: var(--card-radius); padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-title { font-size: 16px; font-weight: 800; color: #1e293b; margin-bottom: 20px; display: block; }

        .budget-display { display: flex; align-items: center; gap: 30px; }
        .budget-info h2 { font-size: 32px; font-weight: 900; margin: 5px 0; }
        .budget-list { list-style: none; padding: 0; margin-top: 20px; }
        .budget-list li { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid #f1f5f9; }

        .donut-section { display: flex; align-items: center; gap: 20px; }
        .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .donut-val { font-size: 24px; font-weight: 900; display: block; }
        .donut-label { font-size: 11px; color: #64748b; font-weight: 700; }

        .gauge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .gauge-card { text-align: center; }
        .gauge-circle { width: 80px; height: 80px; margin: 0 auto 10px; position: relative; }

        .personnel-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .personnel-table th { text-align: left; padding: 8px; color: #64748b; font-weight: 700; border-bottom: 2px solid #f1f5f9; }
        .personnel-table td { padding: 8px; border-bottom: 1px solid #f8fafc; }

        .actions { position: fixed; bottom: 30px; right: 30px; display: flex; gap: 15px; }
        .action-btn { background: #0f172a; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .actions, .mock-sidebar { display: none !important; }
            .report-container { 
                grid-template-columns: 1fr !important; 
                width: 100% !important; 
                max-width: none !important;
                margin: 0 !important;
                padding: 5px !important;
                gap: 10px !important;
                transform: none !important;
            }
            .main-content { gap: 15px !important; }
            .card { 
                box-shadow: none !important; 
                border: 1px solid #e2e8f0 !important; 
                page-break-inside: avoid;
                padding: 15px !important;
            }
            .card-title { font-size: 14px !important; margin-bottom: 10px !important; }
            .personnel-table th, .personnel-table td { padding: 6px !important; font-size: 11px !important; }
            .budget-info h2 { font-size: 24px !important; }
            .report-header-card h1 { font-size: 22px !important; }
            .report-header-card { padding: 15px 30px !important; }
            canvas { max-height: 150px !important; }
            .gauge-circle { width: 60px !important; height: 60px !important; }
            .gauge-circle span { font-size: 11px !important; }
        }
    </style>
</head>
<body>
    <div class="report-container" id="reportContent">
        <!-- Sidebar Mock -->
        <aside class="mock-sidebar">
            <div class="logo">
                <svg viewBox="0 0 120 120"><defs><linearGradient id="lg"><stop offset="0%" stopColor="#60a5fa"/><stop offset="100%" stopColor="#3b82f6"/></linearGradient></defs><rect x="14" y="14" width="92" height="92" rx="24" fill="none"/><path d="M36 32 H62 C70 32 76 38 76 46 V74 C76 82 70 88 62 88 H36" stroke="url(#lg)" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M42 48 H60 C65 48 70 52 70 58 V58 C70 64 65 68 60 68 H42" stroke="url(#lg)" stroke-width="12" stroke-linecap="round" fill="none"/></svg>
                <h2 style="margin:0; font-size:20px;">ProBASE</h2>
            </div>
            <button class="sidebar-btn">MÜŞTERİLER</button>
            <button class="sidebar-btn">PROJELER</button>
            <button class="sidebar-btn secondary">RAPORLAR</button>
        </aside>

        <main class="main-content">
            <header class="report-header-card">
                <h1>RAPORLAR</h1>
                <div style="text-align: right;">
                    <div id="projectName" style="font-weight: 800; color: #0f172a;">Proje Adı</div>
                    <div id="reportDate" style="font-size: 12px; color: #64748b;">Tarih</div>
                </div>
            </header>

            <div class="top-row">
                <div class="card">
                    <span class="card-title">Bütçe Dağılımı ve Harcamalar</span>
                    <div class="budget-display">
                        <div style="width: 200px; height: 200px;"><canvas id="budgetChart"></canvas></div>
                        <div class="budget-info" style="flex: 1;">
                            <span style="font-size: 13px; font-weight: 700; color: #64748b;">TOPLAM BÜTÇE</span>
                            <h2 id="totalBudget">0 TL</h2>
                            <ul class="budget-list" id="budgetList">
                                <!-- Dinamik -->
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <span class="card-title">Görev Durumu</span>
                    <div class="donut-section">
                        <div style="width: 150px; height: 150px; position: relative;">
                            <canvas id="taskChart"></canvas>
                            <div class="donut-center">
                                <span class="donut-val" id="totalTasks">0</span>
                                <span class="donut-label">TOPLAM</span>
                            </div>
                        </div>
                        <ul class="budget-list" style="flex:1;">
                            <li><span>Tamamlanan</span> <strong id="doneTasks">0</strong></li>
                            <li><span>Devam Eden</span> <strong id="pendingTasks">0</strong></li>
                            <li><span>Başarı Oranı</span> <strong id="successRate">%0</strong></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="bottom-row">
                <div class="card">
                    <span class="card-title">Kritik Performans Göstergeleri</span>
                    <div class="gauge-grid" id="gaugeGrid">
                        <!-- Gauges -->
                    </div>
                </div>

                <div class="card">
                    <span class="card-title">Ekip İş Yükü Dağılımı</span>
                    <table class="personnel-table">
                        <thead>
                            <tr>
                                <th>Personel</th>
                                <th>Görev</th>
                                <th>İlerleme</th>
                            </tr>
                        </thead>
                        <tbody id="personnelTable">
                            <!-- Veri -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="actions">
        <button class="action-btn" onclick="downloadPDF()">PDF OLARAK İNDİR</button>
        <button class="action-btn" style="background:white; color:#0f172a; border:1px solid #e2e8f0;" onclick="window.close()">KAPAT</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        async function init() {
            if(!projectId) return;
            const r = await fetch(`/api/reports-data/${projectId}`);
            const data = await r.json();

            document.getElementById('projectName').textContent = data.project.ad;
            document.getElementById('reportDate').textContent = new Date().toLocaleDateString('tr-TR');
            document.getElementById('totalBudget').textContent = data.project.butce.toLocaleString('tr-TR') + " TL";

            renderBudget(data);
            renderTasks(data);
            renderGauges(data);
            renderPersonnel(data);
            
            // Log
            fetch('/api/reports', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ project_id: projectId, summary: `Rapor: ${data.project.ad}` })
            });
        }

        function renderBudget(data) {
            const used = data.project.butce * (data.project.ilerleme/100);
            const remaining = data.project.butce - used;
            
            new Chart(document.getElementById('budgetChart'), {
                type: 'pie',
                data: {
                    datasets: [{
                        data: [used, remaining],
                        backgroundColor: ['#3b82f6', '#f59e0b'],
                        borderWidth: 0
                    }]
                },
                options: { 
                    maintainAspectRatio: false,
                    animation: false 
                }
            });

            const list = document.getElementById('budgetList');
            list.innerHTML = `
                <li><span>HARCANAN</span> <strong>${used.toLocaleString()} TL</strong></li>
                <li><span>KALAN</span> <strong>${remaining.toLocaleString()} TL</strong></li>
                <li><span>KULLANIM</span> <strong>%${data.project.ilerleme}</strong></li>
            `;
        }

        function renderTasks(data) {
            const done = data.tasks.filter(t => t.progress === 100).length;
            const total = data.tasks.length;
            const rate = total > 0 ? Math.round((done/total)*100) : 0;

            new Chart(document.getElementById('taskChart'), {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [done, total-done],
                        backgroundColor: ['#10b981', '#e2e8f0'],
                        borderWidth: 0
                    }]
                },
                options: { 
                    cutout: '80%', 
                    maintainAspectRatio: false,
                    animation: false
                }
            });

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('doneTasks').textContent = done;
            document.getElementById('pendingTasks').textContent = total - done;
            document.getElementById('successRate').textContent = `%${rate}`;
        }

        function renderGauges(data) {
            const metrics = [
                { label: 'Başarı', val: data.project.ilerleme, color: '#3b82f6' },
                { label: 'Zaman', val: 82, color: '#8b5cf6' },
                { label: 'Verim', val: 94, color: '#10b981' }
            ];
            const grid = document.getElementById('gaugeGrid');
            metrics.forEach(m => {
                grid.innerHTML += `
                    <div class="gauge-card">
                        <div class="gauge-circle">
                            <svg viewBox="0 0 36 36">
                                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#f1f5f9" stroke-width="3" />
                                <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="${m.color}" stroke-width="3" stroke-dasharray="${m.val}, 100" />
                            </svg>
                            <span style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-weight:800; font-size:14px;">%${m.val}</span>
                        </div>
                        <span style="font-size:11px; font-weight:700; color:#64748b;">${m.label.toUpperCase()}</span>
                    </div>
                `;
            });
        }

        function renderPersonnel(data) {
            const pData = {};
            data.tasks.forEach(t => {
                if(!pData[t.sorumlu_kisi]) pData[t.sorumlu_kisi] = { total: 0, done: 0 };
                pData[t.sorumlu_kisi].total++;
                if(t.progress === 100) pData[t.sorumlu_kisi].done++;
            });

            const tbody = document.getElementById('personnelTable');
            Object.keys(pData).forEach(name => {
                const percent = Math.round((pData[name].done/pData[name].total)*100);
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:700;">${name}</td>
                        <td>${pData[name].total}</td>
                        <td>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <div style="flex:1; height:6px; background:#f1f5f9; border-radius:3px; overflow:hidden;">
                                    <div style="width:${percent}%; height:100%; background:#3b82f6;"></div>
                                </div>
                                <strong>%${percent}</strong>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function downloadPDF() {
            const element = document.getElementById('reportContent');
            const btn = document.querySelector('.action-btn');
            const originalText = btn.textContent;
            
            btn.textContent = "HAZIRLANIYOR...";
            btn.disabled = true;

            // Sayfa kaymasını ve bölünmeyi önlemek için ayarlar
            window.scrollTo(0, 0);

            const opt = {
                margin: [5, 5, 5, 5],
                filename: `ProBASE_Rapor_${document.getElementById('projectName').textContent}.pdf`,
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { 
                    scale: 2, 
                    useCORS: true, 
                    letterRendering: true,
                    scrollY: 0,
                    windowWidth: 1400
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape', compress: true },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            // Geçici olarak içeriği küçült (tek sayfaya sığması için)
            const originalTransform = element.style.transform;
            const originalWidth = element.style.width;
            
            // PDF için geçici stil: %80 ölçekleme
            element.style.width = "1300px"; 
            
            html2pdf().set(opt).from(element).toPdf().get('pdf').then(function (pdf) {
                // PDF oluşturulduktan sonra stili geri al
                element.style.transform = originalTransform;
                element.style.width = originalWidth;
                btn.textContent = originalText;
                btn.disabled = false;
            }).save();
        }

            init();
    </script>
</body>
</html>
