<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProBASE Giriş</title>
    <link rel="stylesheet" href="giriş.css" />
  </head>
  <body>
    <main class="giris-sayfasi">
      <section class="giris-karti">
        <div class="logo-alani">
          <svg
            class="logo-icon"
            viewBox="0 0 120 120"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#1d4ed8" />
                <stop offset="100%" stopColor="#2563eb" />
              </linearGradient>
            </defs>
            <rect x="14" y="14" width="92" height="92" rx="24" fill="#f8fbff" />
            <path
              d="M36 32 H62 C70 32 76 38 76 46 V74 C76 82 70 88 62 88 H36"
              stroke="url(#lg1)"
              stroke-width="12"
              stroke-linecap="round"
              fill="none"
            />
            <path
              d="M42 48 H60 C65 48 70 52 70 58 V58 C70 64 65 68 60 68 H42"
              stroke="url(#lg1)"
              stroke-width="12"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
          <div class="logo-yazi">
            <h1>ProBASE</h1>
            <p>Proje & Kaynak Yönetimi</p>
          </div>
        </div>

        <form class="giris-formu" onsubmit="girisYap(event)">
          <div class="form-grup">
            <label for="email">Email adresi:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="admin@probase.com"
              required
            />
          </div>

          <div class="form-grup">
            <div class="sifre-baslik">
              <label for="sifre">Parola</label>
              <a href="e-posta.html" class="sifremi-unuttum"
                >Parolamı Unuttum?</a
              >
            </div>
            <input
              type="password"
              id="sifre"
              name="sifre"
              placeholder="••••••"
              required
            />
          </div>

          <div class="checkbox-grup">
            <input type="checkbox" id="hatirla" name="hatirla" />
            <label for="hatirla">Parolamı Hatırla</label>
          </div>

          <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;">
            <button type="submit" class="giris-dugmesi" style="background: #3b82f6;">Giriş Yap</button>
          </div>
        </form>

        <div class="hesap-alani">
          <p>
            Hesabınız yok mu?
            <a href="kayıt.html" class="hesap-olustur">Hesap Oluştur</a>
          </p>
        </div>
      </section>
    </main>

    <script>
      async function girisYap(event) {
        event.preventDefault();
        const email = document.getElementById("email").value;
        const sifre = document.getElementById("sifre").value;

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, sifre })
          });
          
          const data = await response.json();
          if (response.ok) {
            localStorage.setItem('userRole', data.rol);
            localStorage.setItem('userName', data.kullaniciAdi);
            if(data.departman) localStorage.setItem('userDept', data.departman);

            if (data.rol === 'admin') {
              window.location.href = "anasayfa.html";
            } else if (data.rol === 'personel') {
              window.location.href = "personel.html";
            } else if (data.rol === 'musteri') {
              window.location.href = "musteri-paneli.html";
            } else {
              window.location.href = "anasayfa.html"; 
            }
          } else {
            alert("Giriş başarısız: " + data.error);
          }
        } catch (error) {
          console.error(error);
          alert("Sunucuya ulaşılamadı.");
        }
      }
    </script>
  </body>
</html>
