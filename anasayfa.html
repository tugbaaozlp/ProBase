<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ProBASE Admin</title>
    <link rel="stylesheet" href="anasayfa.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --admin-primary: #2563eb;
            --admin-bg: #f8fafc;
            --font-main: 'Outfit', sans-serif;
        }
        body { font-family: var(--font-main); background: var(--admin-bg); margin: 0; overflow: hidden; }
        .container { display: flex; height: 100vh; width: 100vw; }
        
        /* UNIFIED SIDEBAR */
        .sidebar { width: 260px; background: #0f172a; color: white; padding: 30px 20px; display: flex; flex-direction: column; transition: 0.3s; flex-shrink: 0; }
        .sidebar-logo { display: flex; align-items: center; gap: 15px; margin-bottom: 40px; }
        .sidebar-logo svg { width: 35px; height: 35px; }
        .sidebar-logo h2 { font-size: 24px; font-weight: 900; margin: 0; color: white; }
        
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { background: transparent; color: #94a3b8; border: none; padding: 12px 15px; border-radius: 12px; text-align: left; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 14px; width: 100%; }
        .nav-btn.active { background: #1e293b; color: white; }
        .nav-btn:hover { background: #1e293b; color: white; }
        
        .cikis-btn { background: #fee2e2; color: #ef4444; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: auto; }

        .dashboard { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; }
        .dashboard-header h1 { font-size: 32px; font-weight: 800; color: #0f172a; margin-bottom: 30px; }

        /* Metrics Consistency */
        .metrics-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: white; padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 20px; }
        .metric-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .metric-content h3 { margin: 0; font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase; }
        .metric-value { margin: 5px 0 0; font-size: 24px; font-weight: 800; color: #0f172a; }

        .grafik-bolumu { background: white; padding: 30px; border-radius: 24px; border: 1px solid #e2e8f0; margin-bottom: 30px; }
        .grafik-bolumu h2 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 20px; }

        .tablo-bolumu { background: white; padding: 30px; border-radius: 24px; border: 1px solid #e2e8f0; }
        .tablo-bolumu h2 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 20px; }
        .tasks-table { width: 100%; border-collapse: collapse; }
        .tasks-table th { text-align: left; padding: 15px; font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; background: #f8fafc; }
        .tasks-table td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .status-badge { padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <svg viewBox="0 0 120 120"><defs><linearGradient id="g15"><stop offset="0%" stopColor="#60a5fa"/><stop offset="100%" stopColor="#3b82f6"/></linearGradient></defs><rect x="14" y="14" width="92" height="92" rx="24" fill="none"/><path d="M36 32 H62 C70 32 76 38 76 46 V74 C76 82 70 88 62 88 H36" stroke="url(#g15)" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M42 48 H60 C65 48 70 52 70 58 V58 C70 64 65 68 60 68 H42" stroke="url(#g15)" stroke-width="12" stroke-linecap="round" fill="none"/></svg>
                <h2>ProBASE</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" onclick="location.href='anasayfa.html'">🏠 DASHBOARD</button>
                <button class="nav-btn" onclick="location.href='musteriler.html'">👥 MÜŞTERİLER</button>
                <button class="nav-btn" onclick="location.href='projeler.html'">📊 PROJELER</button>
                <button class="nav-btn" onclick="location.href='sohbet.html'">💬 SOHBET</button>
            </nav>
            <button class="cikis-btn" onclick="localStorage.clear(); location.href='giriş.html'">Çıkış Yap</button>
        </aside>

        <main class="dashboard">
            <header class="dashboard-header">
                <h1>Dashboard</h1>
            </header>

            <div class="metrics-container">
                <div class="metric-card">
                    <div class="metric-icon" style="background: #d1fae5">📈</div>
                    <div class="metric-content">
                        <h3>Aktif Projeler</h3>
                        <p class="metric-value" id="aktif-projeler">0</p>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon" style="background: #fef3c7">📦</div>
                    <div class="metric-content">
                        <h3>Tamamlanan</h3>
                        <p class="metric-value" id="tamamlanan">0</p>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon" style="background: #f3e8ff">👥</div>
                    <div class="metric-content">
                        <h3>Mevcut Kaynaklar</h3>
                        <p class="metric-value" id="kaynaklar">0</p>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon" style="background: #fed7aa">💰</div>
                    <div class="metric-content">
                        <h3>Toplam Bütçe</h3>
                        <p class="metric-value" id="butce">0</p>
                    </div>
                </div>
            </div>

            <div class="alert-box" id="uyari-kutusu" style="display: none; background:#fee2e2; color:#ef4444; padding:15px 25px; border-radius:15px; margin-bottom:30px; font-weight:700;">
                <strong>DİKKAT!</strong> <span id="uyari-metni"></span>
            </div>

            <section class="grafik-bolumu">
                <h2>Proje İşleme Grafiği</h2>
                <svg class="grafik" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stopColor="#60a5fa" />
                            <stop offset="100%" stopColor="#60a5fa" opacity="0.1" />
                        </linearGradient>
                    </defs>
                    <polyline id="chartPoly" points="40,200 760,200" fill="none" stroke="#3b82f6" stroke-width="3" />
                    <polygon id="chartFill" points="40,250 760,250" fill="url(#chartGrad)" />
                </svg>
            </section>

            <section class="tablo-bolumu">
                <h2>Görevler ve Son Güncellemeler</h2>
                <table class="tasks-table">
                    <thead>
                        <tr>
                            <th>Görev Adı</th>
                            <th>Müşteri</th>
                            <th>Teslim Tarihi</th>
                            <th>Durum</th>
                        </tr>
                    </thead>
                    <tbody id="gorevler-tablosu">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #64748b; padding: 20px">Görev veya güncelleme yok</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
          async function verileriYukle() {
            try {
                const r = await fetch('/api/projects');
                const projects = await r.json();
                
                // Metrics
                const activeCount = projects.filter(p => (p.ilerleme || 0) < 100).length;
                const doneCount = projects.filter(p => (p.ilerleme || 0) === 100).length;
                const totalBudget = projects.reduce((a, b) => a + (b.butce || 0), 0);
                
                document.getElementById("aktif-projeler").textContent = activeCount;
                document.getElementById("tamamlanan").textContent = doneCount;
                document.getElementById("kaynaklar").textContent = projects.length * 2; // Simüle edilmiş kaynak
                document.getElementById("butce").textContent = totalBudget.toLocaleString("tr-TR") + " ₺";

                // Dynamic Chart
                const chartPoly = document.getElementById("chartPoly");
                const chartFill = document.getElementById("chartFill");
                
                if (projects.length > 0) {
                    const stepX = 720 / (projects.length > 1 ? projects.length - 1 : 1);
                    let points = "";
                    projects.forEach((p, i) => {
                        const x = 40 + (i * stepX);
                        const y = 200 - ((p.ilerleme || 0) * 1.5); // 0% = 200, 100% = 50
                        points += `${x},${y} `;
                    });
                    chartPoly.setAttribute("points", points.trim());
                    chartFill.setAttribute("points", `40,250 ${points} 760,250`);
                }

                // Tasks Table (Last 5 tasks)
                const rt = await fetch('/api/tasks');
                const tasks = await rt.json();
                const tbody = document.getElementById("gorevler-tablosu");
                if (tasks.length > 0) {
                    tbody.innerHTML = tasks.slice(-5).reverse().map(t => `
                        <tr>
                            <td style="font-weight:700; color:#0f172a;">${t.baslik}</td>
                            <td style="color:#64748b;">${t.sorumlu_kisi}</td>
                            <td>${new Date().toLocaleDateString('tr-TR')}</td>
                            <td><span class="status-badge" style="background:${t.progress===100?'#10b981':'#f97316'}; color:white;">${t.progress===100?'TAMAMLANDI':'DEVAM EDİYOR'}</span></td>
                        </tr>
                    `).join('');
                }
            } catch(e) { console.error(e); }
        }
        document.addEventListener("DOMContentLoaded", verileriYukle);
    </script>
</body>
</html>
