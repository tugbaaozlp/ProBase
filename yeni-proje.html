<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Proje - ProBASE</title>
    <link rel="stylesheet" href="anasayfa.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8fafc; }
        .create-form-container { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 900px; margin: 40px auto; }
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .form-col label { font-weight: 600; color: #1e293b; font-size: 14px; }
        .form-col input, .form-col select { padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; outline: none; transition: 0.3s; }
        .form-col input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .personnel-selection { margin-top: 30px; border-top: 1px solid #f1f5f9; padding-top: 25px; }
        .personnel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
        .p-item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid #f1f5f9; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .p-item:hover { background: #f8fafc; border-color: #3b82f6; }
        .p-item input { width: 18px; height: 18px; cursor: pointer; }
        .p-info { display: flex; flex-direction: column; }
        .p-name { font-size: 13px; font-weight: 700; color: #1e293b; }
        .p-dept { font-size: 11px; color: #64748b; }

        .btn-primary { background: #3b82f6; color: white; border: none; padding: 14px 30px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="create-form-container">
        <h2 style="margin-bottom:25px; color:#0f172a; font-weight:800;">Yeni Proje Oluştur</h2>
        
        <div class="form-row">
            <div class="form-col">
                <label>Proje Adı</label>
                <input type="text" id="projeAdi" placeholder="Örn: Mobil E-Ticaret Uygulaması">
            </div>
            <div class="form-col">
                <label>Müşteri</label>
                <input type="text" id="musteriAdi" placeholder="Müşteri veya Şirket ismi">
            </div>
        </div>

        <div class="form-row">
            <div class="form-col">
                <label>Başlangıç Tarihi</label>
                <input type="date" id="baslangicTarihi">
            </div>
            <div class="form-col">
                <label>Teslim Tarihi</label>
                <input type="date" id="teslimTarihi">
            </div>
        </div>

        <div class="form-row">
            <div class="form-col">
                <label>Bütçe (₺)</label>
                <input type="number" id="projeButcesi" placeholder="Örn: 500000">
            </div>
            <div class="form-col">
                <label>Proje Kategorisi</label>
                <select id="projeKategorisi">
                    <option value="Yazılım">Yazılım Geliştirme</option>
                    <option value="Tasarım">UI/UX Tasarım</option>
                    <option value="Pazarlama">Dijital Pazarlama</option>
                    <option value="Danışmanlık">Stratejik Danışmanlık</option>
                </select>
            </div>
        </div>

        <div class="personnel-selection">
            <label style="font-weight:700; color:#1e293b;">Projeye Dahil Edilecek Personeller</label>
            <p style="font-size:12px; color:#64748b; margin:5px 0 15px 0;">Seçilen personellere yeni proje bildirimi otomatik olarak gönderilecektir.</p>
            <div class="personnel-grid" id="personnelGrid">
                <!-- Personeller JS ile eklenecek -->
            </div>
        </div>

        <div style="margin-top:35px; display:flex; justify-content:flex-end; gap:15px;">
            <button onclick="window.location.href='projeler.html'" style="background:none; border:none; color:#64748b; font-weight:600; cursor:pointer;">İptal</button>
            <button class="btn-primary" onclick="projeyiKaydet()">Projeyi Oluştur ve Personellere Bildir</button>
        </div>
    </div>

    <script>
        const personeller = [
            { name: "Kevser Demir", dept: "Tasarım" },
            { name: "Ali Yılmaz", dept: "Backend" },
            { name: "Tuğçe Aydın", dept: "Frontend" },
            { name: "Sema Kanca", dept: "Veritabanı" },
            { name: "Zübeyde Kaya", dept: "Proje Yönetimi" },
            { name: "Fatmanur Yılmaz", dept: "Mobil Uygulama" },
            { name: "Ömer Faruk", dept: "Siber Güvenlik" }
        ];

        function renderPersonnel() {
            const grid = document.getElementById("personnelGrid");
            personeller.forEach(p => {
                const div = document.createElement("div");
                div.className = "p-item";
                div.innerHTML = `
                    <input type="checkbox" name="personnel" value="${p.name}">
                    <div class="p-info">
                        <span class="p-name">${p.name}</span>
                        <span class="p-dept">${p.dept}</span>
                    </div>
                `;
                div.onclick = (e) => {
                    if(e.target.tagName !== 'INPUT') {
                        const cb = div.querySelector('input');
                        cb.checked = !cb.checked;
                    }
                };
                grid.appendChild(div);
            });
        }

        async function projeyiKaydet() {
            const ad = document.getElementById("projeAdi").value;
            const musteri = document.getElementById("musteriAdi").value;
            const butce = document.getElementById("projeButcesi").value;
            const baslangic = document.getElementById("baslangicTarihi").value;
            const bitis = document.getElementById("teslimTarihi").value;
            const kategori = document.getElementById("projeKategorisi").value;
            
            const selected = Array.from(document.querySelectorAll('input[name="personnel"]:checked')).map(cb => cb.value);

            if(!ad || !musteri) { alert("Lütfen proje adını ve müşteriyi giriniz."); return; }

            try {
                const r = await fetch('/api/projects', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ad, musteri, butce, baslangic, bitis, kategori,
                        assigned_personnel: selected
                    })
                });

                if(r.ok) {
                    alert("Proje başarıyla oluşturuldu! Seçilen personellere bildirim gönderildi.");
                    window.location.href = "projeler.html";
                } else {
                    alert("Hata oluştu.");
                }
            } catch(e) { console.error(e); alert("Sunucu hatası."); }
        }

        window.onload = renderPersonnel;
    </script>
</body>
</html>
