<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yeni Müşteri Kaydı - ProBASE</title>
    <link rel="stylesheet" href="anasayfa.css" />
    <style>
      .form-page-container {
        max-width: 800px;
        margin: 40px auto;
        background: #eef2f6; /* Görseldeki açık gri arkaplan */
        padding: 40px;
        border-radius: 12px;
      }
      .form-page-container h1 {
        font-size: 32px;
        color: #0f172a;
        margin-bottom: 32px;
        font-weight: bold;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .form-group label {
        font-size: 18px;
        color: #1e293b;
      }
      .form-group label.link-style {
        text-decoration: underline;
        color: #1e293b;
      }
      .form-input {
        padding: 14px 16px;
        border: 1px solid #94a3b8;
        border-radius: 24px;
        font-size: 16px;
        outline: none;
      }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 16px;
        margin-top: 40px;
      }
      .btn-cancel, .btn-submit {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }
      .btn-cancel:hover, .btn-submit:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body style="background: #f8fafc;">
    
    <div class="form-page-container">
      <h1>Yeni Müşteri Kaydı</h1>
      
      <div class="form-grid">
        <div class="form-group">
          <label class="link-style">Yetkili Adı Soyadı</label>
          <input type="text" id="yetkiliAdi" class="form-input">
        </div>
        <div class="form-group">
          <label>Unvan</label>
          <input type="text" id="unvan" class="form-input">
        </div>

        <div class="form-group">
          <label>Şirket Adı</label>
          <input type="text" id="sirketAdi" class="form-input">
        </div>
        <div class="form-group">
          <label>Sektör</label>
          <input type="text" id="sektor" class="form-input">
        </div>

        <div class="form-group">
          <label>İletişim Numarası</label>
          <input type="text" id="iletisimNo" class="form-input">
        </div>
        <div class="form-group">
          <label>E-Posta</label>
          <input type="email" id="eposta" class="form-input">
        </div>


        <div class="form-group">
          <label>Adres</label>
          <input type="text" id="adres" class="form-input">
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-cancel" onclick="window.location.href='musteriler.html'">İptal</button>
        <button class="btn-submit" onclick="kaydetVeGit()">Müşteriyi Kaydet</button>
      </div>
    </div>

    <script>
      function kaydetVeGit() {
        const ad = document.getElementById("sirketAdi").value || "Yeni Şirket";
        const sektor = document.getElementById("sektor").value || "Belirtilmedi";
        
        const yeniMusteri = {
          ad: ad,
          sektor: sektor,
          butce: "0",
          durum: "Devam Ediyor"
        };

        const musteriler = JSON.parse(localStorage.getItem("musterilerListesi")) || [];
        musteriler.push(yeniMusteri);
        localStorage.setItem("musterilerListesi", JSON.stringify(musteriler));

        window.location.href = "musteriler.html";
      }
    </script>
  </body>
</html>
